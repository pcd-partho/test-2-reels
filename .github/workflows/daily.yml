name: make-video
on:
  schedule:
    - cron: "0 3 * * 1,3,5"     # Mon, Wed, Fri 03:00 UTC (09:00 in Bangladesh). Edit to change.
  workflow_dispatch: {}          # lets you press "Run workflow" by hand
permissions:
  contents: write
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System tools and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng fonts-noto-core
      - run: pip install -r requirements.txt
      - name: Make the video
        env:
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m pipeline.run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-${{ github.run_number }}
          path: out/
          retention-days: 14
      - name: Remember used repos
        run: |
          git config user.name "video-bot"
          git config user.email "video-bot@users.noreply.github.com"
          git add topics.json
          git diff --cached --quiet || (git commit -m "update topics [skip ci]" && git push)
